name: Run APIM Extractor

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Choose which environment to extract from'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
      CONFIGURATION_YAML_PATH:
        description: 'Choose whether to extract all APIs or use the extraction configuration file'
        required: true
        type: choice
        options:
          - Extract All APIs
          - configuration.extractor.yaml

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  extract:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.ENVIRONMENT }}
    env:
      APIM_RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP_NAME }}
      APIM_SERVICE_NAME: ${{ vars.APIM_INSTANCE_NAME }}
    steps:
      - name: Validate required environment variables
        run: |
          if [ -z "${{ env.APIM_RESOURCE_GROUP }}" ]; then
            echo "::error::RESOURCE_GROUP_NAME environment variable is not set for environment '${{ github.event.inputs.ENVIRONMENT }}'"
            exit 1
          fi
          if [ -z "${{ env.APIM_SERVICE_NAME }}" ]; then
            echo "::error::APIM_INSTANCE_NAME environment variable is not set for environment '${{ github.event.inputs.ENVIRONMENT }}'"
            exit 1
          fi
          echo "All required environment variables are configured"
          echo "  Environment: ${{ github.event.inputs.ENVIRONMENT }}"
          echo "  Resource Group: ${{ env.APIM_RESOURCE_GROUP }}"
          echo "  Service Name: ${{ env.APIM_SERVICE_NAME }}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Azure Login (Federated Credential)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run APIM Extract (All APIs)
        if: ${{ github.event.inputs.CONFIGURATION_YAML_PATH == 'Extract All APIs' }}
        run: |
          npx apiops extract \
            --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.APIM_RESOURCE_GROUP }} \
            --service-name ${{ env.APIM_SERVICE_NAME }} \
            --output ./apimartifacts \
            --remove-stale

      - name: Run APIM Extract (With Configuration)
        if: ${{ github.event.inputs.CONFIGURATION_YAML_PATH != 'Extract All APIs' }}
        run: |
          npx apiops extract \
            --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.APIM_RESOURCE_GROUP }} \
            --service-name ${{ env.APIM_SERVICE_NAME }} \
            --output ./apimartifacts \
            --filter configuration.extractor.yaml \
            --remove-stale

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apim-artifacts
          path: ./apimartifacts
          retention-days: 30

  create-pull-request:
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: apim-artifacts
          path: ./apimartifacts

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update APIM artifacts from extract"
          title: "APIM Extract - Update artifacts"
          body: >
            This PR is auto-generated by the APIM extract workflow.
          labels: extract, automated pr
          branch: apim-extract-${{ github.run_id }}
