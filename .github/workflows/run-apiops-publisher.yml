name: Run APIM Publisher

on:
  push:
    branches:
      - main
    paths:
      - 'apimartifacts/**'
      - 'configuration.*.yaml'
  workflow_dispatch:
    inputs:
      COMMIT_ID_CHOICE:
        description: 'Choose "publish-all-artifacts-in-repo" only when you want to force republishing all artifacts (e.g. after build failure). Otherwise stick with the default behavior of "publish-artifacts-in-last-commit"'
        required: true
        type: choice
        default: publish-artifacts-in-last-commit
        options:
          - publish-artifacts-in-last-commit
          - publish-all-artifacts-in-repo
      ENVIRONMENT:
        description: 'Choose which environment to publish to'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
      DRY_RUN_ONLY:
        description: 'Validate the deployment without changing APIM'
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

# A single workflow-level variable selects the target environment. On manual runs
# it comes from the ENVIRONMENT input; on push to main it defaults to 'dev'.
env:
  TARGET_ENV: ${{ github.event.inputs.ENVIRONMENT || 'dev' }}
  RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
  APIM_INSTANCE_NAME: ${{ vars.APIM_INSTANCE_NAME }}
  TEST_SECRET_VALUE: ${{ vars.RESOURCE_GROUP_NAME }}

jobs:
  get-commit:
    runs-on: ubuntu-latest
    outputs:
      commit_id: ${{ steps.commit.outputs.commit_id }}
    steps:
      - name: Set the Commit Id
        id: commit
        run: echo "commit_id=${GITHUB_SHA}" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.ENVIRONMENT || 'dev' }}
    needs: get-commit
    env:
      RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
      APIM_INSTANCE_NAME: ${{ vars.APIM_INSTANCE_NAME }}
      TEST_SECRET_VALUE: ${{ vars.RESOURCE_GROUP_NAME }}
      TARGET_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      MANAGED_SUBSCRIPTION_NAME: 66ce4b511f9b910053070002
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Resolve target environment
        id: env
        run: |
          echo "name=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "upper=$(echo "${TARGET_ENV}" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"

      - name: Azure Login (Federated Credential)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get subscription keys from Key Vault
        id: get-subscription-keys
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: ${{ secrets.KEYVAULT_NAME }}
          secrets: 'APIM-Unlimited-Subscription-Primary-Key, APIM-Unlimited-Subscription-Secondary-Key'

      - name: Map Key Vault values to APIOps tokens
        env:
          PRIMARY_KEY: ${{ steps.get-subscription-keys.outputs['APIM-Unlimited-Subscription-Primary-Key'] }}
          SECONDARY_KEY: ${{ steps.get-subscription-keys.outputs['APIM-Unlimited-Subscription-Secondary-Key'] }}
        run: |
          echo "::add-mask::${PRIMARY_KEY}"
          echo "::add-mask::${SECONDARY_KEY}"
          echo "UNLIMITED_SUBSCRIPTION_PRIMARY_KEY=${PRIMARY_KEY}" >> "$GITHUB_ENV"
          echo "UNLIMITED_SUBSCRIPTION_SECONDARY_KEY=${SECONDARY_KEY}" >> "$GITHUB_ENV"

      - name: Validate token source values
        env:
          AVAILABLE_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          missing=0
          config_file="configuration.${TARGET_ENV}.yaml"
          tokens=$(grep -o '{#\[[^]]*\]#}' "$config_file" | sed -E 's/^\{#\[([^]]+)\]#\}$/\1/' | sort -u || true)

          if [ -z "$tokens" ]; then
            echo "No tokens found in $config_file"
            exit 0
          fi

          while IFS= read -r token; do
            if [ -z "$token" ]; then
              continue
            fi

            if ! echo "$token" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
              echo "::error::Token '$token' is not a valid environment variable name. Use letters, numbers, and underscores only."
              missing=1
              continue
            fi

            value=$(jq -r --arg token "$token" '.[$token] // empty' <<< "$AVAILABLE_SECRETS_JSON")
            if [ -z "$value" ]; then
              value=$(printenv "$token" || true)
            fi
            if [ -z "$value" ]; then
              echo "::error::Missing secret or runtime value for token '$token'"
              missing=1
              continue
            fi

            printf '%s=%s\n' "$token" "$value" >> "$GITHUB_ENV"
          done <<< "$tokens"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Substitute tokens in configuration file
        uses: cschleiden/replace-tokens@v1.4
        with:
          tokenPrefix: '{#['
          tokenSuffix: ']#}'
          files: '["configuration.${{ env.TARGET_ENV }}.yaml"]'
          # Token values are injected in the previous step based on token names.
          # Ensure tokens in the configuration file match secret names exactly.

      - name: Validate token substitution
        run: |
          config_file="configuration.${TARGET_ENV}.yaml"
          if grep -q '{#\[' "$config_file"; then
            echo "Unresolved tokens remain in $config_file"
            grep -o '{#\[[^]]*\]#}' "$config_file" | sort -u
            exit 1
          fi

      - name: Dry-run validation (incremental)
        if: ${{ github.event.inputs.COMMIT_ID_CHOICE != 'publish-all-artifacts-in-repo' }}
        run: |
          npx apiops publish \
            --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --service-name ${{ env.APIM_INSTANCE_NAME }} \
            --source ./apimartifacts \
            --overrides configuration.${{ env.TARGET_ENV }}.yaml \
            --commit-id ${{ needs.get-commit.outputs.commit_id }} \
            --dry-run

      - name: Dry-run validation (all artifacts)
        if: ${{ github.event.inputs.COMMIT_ID_CHOICE == 'publish-all-artifacts-in-repo' }}
        run: |
          npx apiops publish \
            --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --service-name ${{ env.APIM_INSTANCE_NAME }} \
            --source ./apimartifacts \
            --overrides configuration.${{ env.TARGET_ENV }}.yaml \
            --dry-run

      - name: Publish (incremental - last commit only)
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.DRY_RUN_ONLY != 'true') && github.event.inputs.COMMIT_ID_CHOICE != 'publish-all-artifacts-in-repo' }}
        run: |
          npx apiops publish \
            --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --service-name ${{ env.APIM_INSTANCE_NAME }} \
            --source ./apimartifacts \
            --overrides configuration.${{ env.TARGET_ENV }}.yaml \
            --commit-id ${{ needs.get-commit.outputs.commit_id }}

      - name: Publish (all artifacts)
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.DRY_RUN_ONLY != 'true') && github.event.inputs.COMMIT_ID_CHOICE == 'publish-all-artifacts-in-repo' }}
        run: |
          npx apiops publish \
            --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --service-name ${{ env.APIM_INSTANCE_NAME }} \
            --source ./apimartifacts \
            --overrides configuration.${{ env.TARGET_ENV }}.yaml

      - name: Validate managed subscription key update
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.DRY_RUN_ONLY == 'true' }}
        run: |
          resource_url="https://management.azure.com/subscriptions/${TARGET_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.ApiManagement/service/${APIM_INSTANCE_NAME}/subscriptions/${MANAGED_SUBSCRIPTION_NAME}?api-version=2024-05-01"
          az rest \
            --method get \
            --url "$resource_url" \
            --query name \
            --output tsv >/dev/null
          echo "[DRY RUN] Would update primary and secondary keys for subscription ${MANAGED_SUBSCRIPTION_NAME}"

      - name: Update managed subscription keys
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.DRY_RUN_ONLY != 'true' }}
        run: |
          if [ -z "${UNLIMITED_SUBSCRIPTION_PRIMARY_KEY}" ] || [ -z "${UNLIMITED_SUBSCRIPTION_SECONDARY_KEY}" ]; then
            echo "::error::Managed subscription keys were not loaded from Key Vault"
            exit 1
          fi

          resource_url="https://management.azure.com/subscriptions/${TARGET_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP_NAME}/providers/Microsoft.ApiManagement/service/${APIM_INSTANCE_NAME}/subscriptions/${MANAGED_SUBSCRIPTION_NAME}?api-version=2024-05-01"
          current_subscription=$(az rest \
            --method get \
            --url "$resource_url" \
            --output json)

          request_body=$(jq -c \
            --arg primaryKey "$UNLIMITED_SUBSCRIPTION_PRIMARY_KEY" \
            --arg secondaryKey "$UNLIMITED_SUBSCRIPTION_SECONDARY_KEY" \
            '{
              properties: {
                displayName: .properties.displayName,
                scope: .properties.scope,
                ownerId: .properties.ownerId,
                primaryKey: $primaryKey,
                secondaryKey: $secondaryKey,
                state: .properties.state,
                allowTracing: .properties.allowTracing
              }
            }' <<< "$current_subscription")

          az rest \
            --method put \
            --url "$resource_url" \
            --headers "Content-Type=application/json" \
            --body "$request_body" \
            --output none
